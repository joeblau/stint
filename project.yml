name: Stint
options:
  bundleIdPrefix: com.joeblau
  deploymentTarget:
    iOS: '18.0'
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Stint:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Stint]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.stint
        PRODUCT_NAME: Stint
        DEVELOPMENT_TEAM: K78G42H4U2
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Stint
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '2'
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readonly
        SUPPORTS_MACCATALYST: NO
  StintTests:
    type: bundle.unit-test
    platform: macOS
    sources: [StintTests]
    dependencies:
      - target: Stint
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Stint.app/Contents/MacOS/Stint
        BUNDLE_LOADER: $(TEST_HOST)
  StintUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StintUITests]
    dependencies:
      - target: Stint
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '2'
  StintMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [StintUITests]
    dependencies:
      - target: Stint
schemes:
  Stint:
    build:
      targets:
        Stint: all
    test:
      targets: [StintTests, StintMacUITests]
  Stint-iPad:
    build:
      targets:
        Stint: all
    test:
      targets: [StintUITests]
